name: tileo-ts
x-common: &common
  image: tileo-ts:local
  init: true
  restart: unless-stopped
  volumes:
    - tileo-data:/data
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
services:
  api:
    <<: *common
    build: .
    command: [node, dist/api.js]
    ports: ["${TILEO_BIND_ADDRESS:-127.0.0.1}:${TILEO_PORT:-8090}:8090"]
    environment:
      TILEO_HOST: 0.0.0.0
      TILEO_LOCAL_PROXY: "1"
      TILEO_API_TOKEN: ${TILEO_API_TOKEN:-}
      TILEO_PUBLIC_ORIGIN: ${TILEO_PUBLIC_ORIGIN:-}
      TILEO_SECURE_COOKIES: ${TILEO_SECURE_COOKIES:-0}
      TILEO_ALLOW_LAN: ${TILEO_ALLOW_LAN:-0}
      TILEO_CORS_ORIGINS: ${TILEO_CORS_ORIGINS:-}
      TILEO_VECTOR_BATCH_MODE: ${TILEO_VECTOR_BATCH_MODE:-off}
      TILEO_VECTOR_BATCH_FEATURES: ${TILEO_VECTOR_BATCH_FEATURES:-10000}
      TILEO_VECTOR_BATCH_MB: ${TILEO_VECTOR_BATCH_MB:-16}
      TILEO_VECTOR_MAX_FEATURE_MB: ${TILEO_VECTOR_MAX_FEATURE_MB:-16}
      TILEO_VECTOR_BATCH_DELIVERY: ${TILEO_VECTOR_BATCH_DELIVERY:-file}
      TILEO_S3_CONNECTIONS: ${TILEO_S3_CONNECTIONS:-}
      TILEO_REMOTE_URL_HOSTS: ${TILEO_REMOTE_URL_HOSTS:-}
      TILEO_REMOTE_INSPECT_SECONDS: ${TILEO_REMOTE_INSPECT_SECONDS:-120}
      TILEO_MAX_REMOTE_STAGE_MB: ${TILEO_MAX_REMOTE_STAGE_MB:-65536}
    mem_limit: 512m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    <<: *common
    command: [node, dist/worker.js]
    environment:
      TILEO_THREADS: ${TILEO_THREADS:-2}
      TILEO_TOOL_MEMORY_MB: ${TILEO_TOOL_MEMORY_MB:-4096}
      TILEO_JOB_TIMEOUT_SECONDS: ${TILEO_JOB_TIMEOUT_SECONDS:-7200}
      TILEO_MAX_SCRATCH_MB: ${TILEO_MAX_SCRATCH_MB:-32768}
      TILEO_VECTOR_BATCH_MODE: ${TILEO_VECTOR_BATCH_MODE:-off}
      TILEO_VECTOR_BATCH_FEATURES: ${TILEO_VECTOR_BATCH_FEATURES:-10000}
      TILEO_VECTOR_BATCH_MB: ${TILEO_VECTOR_BATCH_MB:-16}
      TILEO_VECTOR_MAX_FEATURE_MB: ${TILEO_VECTOR_MAX_FEATURE_MB:-16}
      TILEO_VECTOR_BATCH_DELIVERY: ${TILEO_VECTOR_BATCH_DELIVERY:-file}
      TILEO_S3_CONNECTIONS: ${TILEO_S3_CONNECTIONS:-}
      TILEO_REMOTE_URL_HOSTS: ${TILEO_REMOTE_URL_HOSTS:-}
      TILEO_MAX_REMOTE_STAGE_MB: ${TILEO_MAX_REMOTE_STAGE_MB:-65536}
    mem_limit: ${TILEO_WORKER_MEM_LIMIT:-6g}
    cpus: 2
    pids_limit: 256
    stop_grace_period: 15s
volumes:
  tileo-data:
