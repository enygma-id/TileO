name: Dependency audit and fuzzing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '45 2 * * 3'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit application and independent validators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
      - name: Audit both complete lockfiles (including development dependencies)
        shell: bash
        run: |
          mkdir -p artifacts/security
          status=0
          npm audit --json > artifacts/security/application-audit.json || status=1
          npm audit --prefix tools/output-validation --json > artifacts/security/validators-audit.json || status=1
          exit "$status"
      - name: Preserve audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audits
          path: artifacts/security
          if-no-files-found: error
  fuzz:
    name: Property-based security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run randomized input properties with shrinking and replay seeds
        env:
          FC_NUM_RUNS: '10000'
        run: node --test tests/security-fuzz.test.js
