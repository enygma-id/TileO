name: Release Gate & Permissive Dependency Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# One run per ref: cancel superseded runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Permissive Dependency & Build Verification Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci

      - name: Verify committed notices (final image SBOM belongs to protected release)
        run: |
          node scripts/check-notice-parity.js

      - name: Run 5-stage automated release gate
        run: npm run release:gate
