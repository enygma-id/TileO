name: OpenSSF Scorecard

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 6"

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publication accepts approved actions only; keep shell diagnostics out of this job.
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Preserve SARIF and published JSON results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: |
            results.sarif
            results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
