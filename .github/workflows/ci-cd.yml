name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/verify-npm-notices.js
      - run: node scripts/verify-native-licenses.js
      - run: node scripts/check-notice-parity.js
      - run: npm test
      - name: Validate release tooling syntax
        run: |
          for file in scripts/*.js scripts/lib/*.js; do node --check "$file"; done
