name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: cancel superseded runs for the same branch or tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & License Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify notice parity and license integrity
        run: |
          node scripts/verify-npm-notices.js
          node scripts/verify-native-licenses.js
          node scripts/check-notice-parity.js

      - name: Run negative control release gate checks
        run: node scripts/test-negative-controls.js

      - name: Generate notices and SBOM baseline artifacts
        run: |
          npm run notices
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          syft . -o spdx-json=baseline/sbom.spdx.json -q
          syft . -o cyclonedx-json=baseline/sbom.cyclonedx.json -q

      - name: Run tests
        run: npm test

      - name: Install GDAL for elevation checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin

      - name: Check real elevation conversions
        env:
          TILEO_INTEGRATION: '1'
        run: node --test dist/tests/elevation.test.js dist/tests/source-preview.test.js

  publish:
    name: Build, Audit & Publish (Single-Build Pattern)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify package version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || {
            echo "package.json is $package_version but the tag is $tag_version"
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build candidate image ONCE. All downstream audits, integration tests,
      # and the final registry push use this identical immutable image build.
      - name: Build production release candidate image (once)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tileo-release:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test candidate image
        timeout-minutes: 5
        run: |
          docker run -d --name tileo-smoke -p 8090:8090 -e TILEO_HOST=0.0.0.0 -e TILEO_LOCAL_PROXY=1 tileo-release:candidate
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8090/healthz | grep -q '"status":"ok"'; then
              echo "healthz OK"
              docker rm -f tileo-smoke
              exit 0
            fi
            sleep 2
          done
          echo "healthz did not become ready"
          docker logs tileo-smoke
          exit 1

      - name: Install dependencies for audit tooling
        run: |
          npm ci
          npm run build

      - name: Audit candidate image (ELF closure, GDAL drivers, SBOM, Zero Copyleft)
        run: node scripts/audit-image.js --image tileo-release:candidate

      - name: Run container integration tests on candidate image
        run: node scripts/record-test-results.js tileo-release:candidate

      - name: Generate image notice file path inventory
        run: node scripts/generate-image-notice-paths.js tileo-release:candidate

      - name: Verify release gate pass record
        shell: bash
        run: |
          test -f artifacts/compliance/release-gate-pass.json || { echo "release-gate-pass.json missing!"; exit 1; }
          test -f artifacts/compliance/release-image-digest.txt || { echo "release-image-digest.txt missing!"; exit 1; }
          echo "Verified audit pass record for $(cat artifacts/compliance/release-image-digest.txt)"

      - name: Archive release compliance evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tileo-release-compliance-evidence
          path: |
            artifacts/compliance/**
            third-party/native-components.csv
            THIRD-PARTY-NOTICES.md
            native-license-review.md
            release-approval.md

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      # Push the EXACT audited local image candidate by re-tagging it.
      # Never re-build!
      - name: Publish verified image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "Tagging and pushing: $tag"
            docker tag tileo-release:candidate "$tag"
            docker push "$tag"
          done
