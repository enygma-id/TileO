name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: cancel superseded runs for the same branch or tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & License Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify notice parity and license integrity
        run: |
          node scripts/verify-npm-notices.js
          node scripts/verify-native-licenses.js
          node scripts/check-notice-parity.js

      - name: Run negative control release gate checks
        run: node scripts/test-negative-controls.js

      - name: Run tests
        run: npm test

      - name: Install GDAL for elevation checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin

      - name: Check real elevation conversions
        env:
          TILEO_INTEGRATION: '1'
        run: node --test dist/tests/elevation.test.js dist/tests/source-preview.test.js

  candidate:
    name: Build, Audit & Test Candidate (Single-Build Pattern)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build candidate image ONCE. All downstream audits, integration tests,
      # and the final registry push use this identical immutable image build.
      - name: Build production release candidate image (once)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tileo-release:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test candidate image
        timeout-minutes: 5
        run: |
          docker run -d --name tileo-smoke -p 8090:8090 -e TILEO_HOST=0.0.0.0 -e TILEO_LOCAL_PROXY=1 tileo-release:candidate
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8090/healthz | grep -q '"status":"ok"'; then
              echo "healthz OK"
              docker rm -f tileo-smoke
              exit 0
            fi
            sleep 2
          done
          echo "healthz did not become ready"
          docker logs tileo-smoke
          exit 1

      - name: Install dependencies for audit tooling
        run: |
          npm ci
          npm run build

      - name: Audit candidate image (ELF closure, GDAL drivers, SBOM, Zero Copyleft)
        run: node scripts/audit-image.js --image tileo-release:candidate

      - name: Run container integration tests on candidate image
        run: node scripts/record-test-results.js --image tileo-release:candidate

      - name: Generate image notice file path inventory
        run: node scripts/generate-image-notice-paths.js --image tileo-release:candidate

      - name: Prepare compliance packages (Disclosed Exceptions & Source Archives)
        run: node scripts/prepare-compliance-packages.js

      - name: Certify release gate compliance (Fail-Closed)
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            node scripts/certify-release-gate.js --image tileo-release:candidate --enforce-human-approval
          else
            node scripts/certify-release-gate.js --image tileo-release:candidate
          fi

      - name: Archive release compliance evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tileo-release-compliance-evidence
          path: |
            artifacts/compliance/**
            release-evidence/**
            third-party/native-components.csv
            THIRD-PARTY-NOTICES.md
            native-license-review.md
            release-approval.md

      - name: Export candidate image for release publication
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/image-export
          docker save tileo-release:candidate | gzip > /tmp/image-export/candidate-image.tar.gz

      - name: Upload candidate image artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: tileo-candidate-image
          path: /tmp/image-export/candidate-image.tar.gz
          retention-days: 1

  publish:
    name: Publish Verified Candidate to GHCR (Protected Environment)
    needs: [test, candidate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify package version matches tag
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || {
            echo "package.json is $package_version but the tag is $tag_version"
            exit 1
          }

      - name: Download compliance evidence artifacts
        uses: actions/download-artifact@v4
        with:
          name: tileo-release-compliance-evidence
          path: evidence

      - name: Download candidate image artifact
        uses: actions/download-artifact@v4
        with:
          name: tileo-candidate-image
          path: /tmp/image-export

      - name: Load verified candidate image
        shell: bash
        run: |
          gunzip -c /tmp/image-export/candidate-image.tar.gz | docker load
          pass_file=$(find evidence -name "release-gate-pass.json" | head -n 1)
          test -n "$pass_file" || { echo "release-gate-pass.json missing from evidence!"; exit 1; }
          digest_file=$(find evidence -name "release-image-digest.txt" | head -n 1)
          test -n "$digest_file" || { echo "release-image-digest.txt missing!"; exit 1; }
          expected_id=$(grep -oE 'IMAGE_ID=[^ ]+' "$digest_file" | cut -d= -f2)
          actual_id=$(docker inspect --format='{{.Id}}' tileo-release:candidate)
          echo "Comparing Image IDs: expected=$expected_id, actual=$actual_id"
          test "$expected_id" = "$actual_id" || {
            echo "CRITICAL: Image ID mismatch between audited candidate and release image!"
            exit 1
          }

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      # Push the EXACT audited candidate image without rebuilding.
      - name: Publish verified image to GHCR
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            echo "Tagging and pushing: $tag"
            docker tag tileo-release:candidate "$tag"
            docker push "$tag"
          done
