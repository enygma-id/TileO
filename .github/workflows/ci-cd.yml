name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: cancel superseded runs for the same branch or tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate notices and SBOM baseline artifacts
        run: |
          npm run notices
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          syft . -o spdx-json=baseline/sbom.spdx.json -q
          syft . -o cyclonedx-json=baseline/sbom.cyclonedx.json -q

      - name: Run tests
        run: npm test

      - name: Install GDAL for elevation checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin

      - name: Check real elevation conversions
        env:
          TILEO_INTEGRATION: '1'
        run: node --test dist/tests/elevation.test.js dist/tests/source-preview.test.js

  publish:
    name: Publish release image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify package version matches tag
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || {
            echo "package.json is $package_version but the tag is $tag_version"
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build first without pushing, then smoke-test the image boots and
      # answers /healthz before publishing anything to GHCR.
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tileo-smoke:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        timeout-minutes: 5
        run: |
          docker run -d --name tileo-smoke -p 8090:8090 tileo-smoke:candidate
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8090/healthz | grep -q '"status":"ok"'; then
              echo "healthz OK"
              docker rm -f tileo-smoke
              exit 0
            fi
            sleep 2
          done
          echo "healthz did not become ready"
          docker logs tileo-smoke
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
