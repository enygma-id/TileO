version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Runtime support is Node 24; keep its type declarations on the same major.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /tools/output-validation
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
