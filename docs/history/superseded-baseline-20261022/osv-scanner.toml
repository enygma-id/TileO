# Directory-local configuration for immutable, superseded audit records only.
# OSV applies this file to SBOMs in this directory, not to the active lockfiles.
# Preserve the original SBOM bytes and license results. See README.md for how to
# scan this historical inventory without these vulnerability-only overrides.

